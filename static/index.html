<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caso N°1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ===================== STYLE: black, paper and red, like Black Stories ===================== */
:root {
  --ink: #0f0f0f;
  --ink-soft: #1c1c1c;
  --paper: #efe6d2;
  --paper-dim: #d9d0bd;
  --folder: #c7ad7c;
  --shadow: rgba(0, 0, 0, 0.55);
  --red: #b3121b;
  --red-soft: rgba(179, 18, 27, .12);
  --muted: #8b8478;
  --type: "Special Elite", "Courier New", monospace;   /* typewriter: cards and questions */
  --sans: "Inter", system-ui, sans-serif;              /* everything else */
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--sans); }
a { color: var(--paper); }
.app { max-width: 960px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }

/* top bar: always visible, with the question number and the score */
.topbar { position: sticky; top: 0; z-index: 5; background: var(--ink); border-bottom: 2px solid var(--red);
  padding: 12px 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.case { font-weight: 800; letter-spacing: .12em; text-transform: uppercase; font-size: .9rem; }
.stats { font-family: var(--type); color: var(--muted); white-space: nowrap; }
.stats strong { color: var(--paper); }
main { flex: 1; padding: 16px; }

/* the story: open at the start, can be closed to make room */
details.story { background: var(--ink-soft); border-left: 4px solid var(--red); padding: 10px 14px; margin-bottom: 24px; }
details.story summary { cursor: pointer; font-weight: 600; }
.story p { font-family: var(--type); font-size: 1.1rem; line-height: 1.5; }
button.ghost { background: none; border: 1px solid var(--muted); color: var(--paper); padding: 6px 12px;
  cursor: pointer; font-family: var(--sans); }

/* ---------- the board: two zones, red threads drawn behind the notes ---------- */
.board { position: relative; }
svg.threads { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }
svg.threads path { fill: none; stroke: var(--red); stroke-width: 2.5; stroke-linecap: round;
  filter: drop-shadow(1px 2px 1px rgba(0, 0, 0, .6)); }
svg.threads path.theory { stroke-width: 3.5; }

.zone { position: relative; margin-bottom: 28px; }
.zone-title { display: flex; align-items: center; gap: 12px; font-size: .8rem; font-weight: 800; letter-spacing: .25em;
  color: var(--paper); margin: 0 0 16px; }
.zone-title::after { content: ""; flex: 1; height: 2px; background: var(--red); opacity: .6; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 30px 16px; }

/* clue cards: paper notes pinned to the board */
.card { --rot: var(--tilt); position: relative; z-index: 1; background: var(--paper); color: var(--ink);
  font-family: var(--type); font-size: 1rem; line-height: 1.35; padding: 16px 14px 14px;
  box-shadow: 3px 4px 0 var(--shadow); transform: rotate(var(--rot)); }
.card::before, .slot::before { content: ""; position: absolute; top: -6px; left: var(--pin, 50%); width: 12px; height: 12px;
  margin-left: -6px; border-radius: 50%; background: var(--red); box-shadow: 1px 2px 2px var(--shadow); z-index: 3; }   /* the pin */
.label { display: block; font-family: var(--sans); font-weight: 800; font-size: .65rem; letter-spacing: .2em;
  color: var(--red); margin-bottom: 6px; }
.card.deduction { --rot: calc(var(--tilt) / 4); grid-column: 1 / -1; border: 3px solid var(--red); font-size: 1.15rem; }   /* wide cards tilt less */
.card.theory { --rot: 0deg; grid-column: 1 / -1; border: 5px double var(--red); font-size: 1.25rem;
  box-shadow: 0 0 0 3px var(--ink), 0 0 18px 4px rgba(179, 18, 27, .45); }
.card.theory .label { font-size: .75rem; }
.card.new { animation: pin-in .6s ease-out; }
@keyframes pin-in { from { opacity: 0; transform: scale(1.25) rotate(0deg); } to { opacity: 1; transform: scale(1) rotate(var(--rot)); } }

/* ruled-out leads: in their zone, readable, crossed out and stamped, so the player drops them */
.out-title { font-size: .7rem; font-weight: 800; letter-spacing: .25em; color: var(--red); margin: 26px 0 14px; }
.card.ruled_out { background: var(--paper-dim); color: #3a3530; padding-bottom: 40px; }
.card.ruled_out .struck { text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 2px; }
.card.ruled_out::after { content: "SCARTATA"; position: absolute; right: 8px; bottom: 8px; border: 3px solid var(--red);
  color: var(--red); font-family: var(--sans); font-weight: 800; font-size: .7rem; letter-spacing: .2em;
  padding: 2px 6px; transform: rotate(-10deg); background: rgba(239, 230, 210, .85); }

/* empty notes: where a guide question or a "?" waits for the player */
.slot { position: relative; z-index: 1; min-height: 96px; padding: 16px 14px 14px; border: 2px dashed var(--red);
  background: var(--red-soft); font-family: var(--type); color: var(--paper); display: flex; flex-direction: column;
  justify-content: center; gap: 6px; transform: rotate(var(--tilt)); }
.slot .mark { font-family: var(--sans); font-weight: 800; font-size: 2rem; line-height: 1; color: var(--red); }
.slot .q { font-size: 1.05rem; line-height: 1.35; }
.slot.guide { animation: breathe 3s ease-in-out infinite; }
.slot.thread { align-items: center; text-align: center; }
.slot.thread.theory { grid-column: 1 / -1; border-width: 3px; background: rgba(179, 18, 27, .2); }
@keyframes breathe { 50% { box-shadow: 0 0 14px 2px rgba(179, 18, 27, .45); } }

/* the final question, between the two zones */
.final-wrap { display: flex; justify-content: center; margin: 8px 0 36px; }
.final-wrap:empty { display: none; }
.slot.final { width: min(100%, 460px); min-height: 150px; align-items: center; text-align: center; transform: none;
  border: 4px solid var(--red); background: var(--ink-soft); box-shadow: 0 0 30px 6px rgba(179, 18, 27, .5);
  animation: breathe 2s ease-in-out infinite; }
.slot.final .mark { font-size: 3.4rem; }
.slot.final .q { font-size: 1.3rem; }

/* the sealed file of the past */
.sealed { position: relative; background: var(--folder); color: var(--ink); padding: 34px 20px 28px; margin-top: 34px;
  border-radius: 0 6px 6px 6px; box-shadow: 4px 5px 0 var(--shadow); text-align: center; font-family: var(--type); }
.sealed::before { content: "ANNI PRIMA"; position: absolute; top: -24px; left: 0; background: var(--folder);
  padding: 4px 16px; border-radius: 6px 6px 0 0; font-family: var(--sans); font-weight: 800; font-size: .7rem; letter-spacing: .2em; }
.stamp { display: inline-block; border: 4px solid var(--red); color: var(--red); padding: 6px 18px; font-family: var(--sans);
  font-weight: 800; font-size: 1.6rem; letter-spacing: .25em; transform: rotate(-8deg); opacity: .9; }
.sealed p { margin: 16px 0 0; opacity: .75; }
.opened { animation: open-file .8s ease-out; }
@keyframes open-file { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }

/* question log: closed by default, opened only when needed */
details.drawer { margin-top: 20px; color: var(--muted); }
details.drawer summary { cursor: pointer; }
.log li { font-family: var(--type); margin: 4px 0; }

/* bottom dock: the subtitle with question and answer, then the microphone */
.dock { position: sticky; bottom: 0; z-index: 4; background: linear-gradient(transparent, var(--ink) 18%);
  padding: 28px 16px 16px; text-align: center; }
.subtitle { min-height: 100px; }
.question { color: var(--paper); font-family: var(--type); font-size: 1.15rem; margin: 0;
  text-shadow: 0 1px 6px var(--ink), 0 0 2px var(--ink); }   /* readable over the board */
.answer { font-size: clamp(2rem, 7vw, 3.2rem); font-weight: 800; letter-spacing: .04em; margin: 4px 0 0;
  text-shadow: 0 2px 8px var(--ink), 0 0 3px var(--ink); }   /* readable over the board */
.answer.unclear, .answer.open { font-size: clamp(1.4rem, 4.5vw, 2rem); }
.mic { width: 84px; height: 84px; border-radius: 50%; border: 3px solid var(--red); background: var(--ink-soft);
  color: var(--paper); font-size: 2rem; cursor: pointer; margin: 10px 0 6px; }
.mic.listening { background: var(--red); animation: pulse 1s infinite; }
.mic:disabled { opacity: .4; cursor: wait; }
@keyframes pulse { 50% { box-shadow: 0 0 0 14px rgba(179, 18, 27, .25); } }
.transcript { min-height: 1.4em; color: var(--muted); font-style: italic; margin: 0; }
.hint { color: var(--muted); font-size: .8rem; }
form.typed { display: none; gap: 8px; justify-content: center; margin-top: 10px; }
form.typed.open { display: flex; }
form.typed input { flex: 1; max-width: 420px; background: var(--ink-soft); border: 1px solid var(--muted);
  color: var(--paper); padding: 10px; font-family: var(--type); }

/* case solved: full-screen overlay with the solution */
.win { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
  padding: 16px; background: rgba(0, 0, 0, .92); }
.win.open { display: flex; }
.win-card { max-width: 560px; padding: 28px; background: var(--paper); color: var(--ink); border-top: 8px solid var(--red); }
.win-card h2 { color: var(--red); font-size: 1.4rem; letter-spacing: .15em; margin: 0 0 14px; }
.win-card p { font-family: var(--type); line-height: 1.5; }
.win-card button { color: var(--ink); border-color: var(--ink); }
</style>
</head>
<body>
<!-- ===================== STRUCTURE ===================== -->
<div class="app">
  <header class="topbar">
    <span class="case" id="case">Caso N°1</span>
    <span class="stats">Domanda <strong id="questions">0</strong> · <strong id="score">0</strong> punti</span>
  </header>

  <main>
    <details class="story" open>
      <summary>La storia</summary>
      <p id="story-text"></p>
      <button class="ghost" id="read-story">▶ Ascolta</button>
    </details>

    <div class="board" id="board">
      <svg class="threads" id="threads"></svg>
      <section class="zone">
        <h2 class="zone-title">IL RISTORANTE</h2>
        <div class="cards" id="zone-restaurant"></div>
        <div id="out-restaurant"></div>
      </section>
      <div class="final-wrap" id="final-wrap"></div>
      <section class="zone" id="zone-past"></section>
    </div>

    <details class="drawer">
      <summary>Registro domande (<span id="log-count">0</span>)</summary>
      <ol class="log" id="log" reversed></ol>
    </details>
  </main>

  <footer class="dock">
    <div class="subtitle" aria-live="polite">
      <p class="question" id="question"></p>
      <p class="answer" id="answer"></p>
    </div>
    <button class="mic" id="mic" aria-label="Fai una domanda">
      <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/>
      </svg>
    </button>
    <p class="transcript" id="transcript"></p>
    <p class="hint"><span id="mic-hint">Premi il microfono o la barra spaziatrice, poi parla</span> · <a href="#" id="toggle-typed">scrivi</a></p>
    <form class="typed" id="typed">
      <input id="typed-input" autocomplete="off" placeholder="Scrivi una domanda" maxlength="200">
      <button class="ghost">Invia</button>
    </form>
  </footer>
</div>

<div class="win" id="win">
  <div class="win-card">
    <h2>CASO RISOLTO</h2>
    <p id="solution"></p>
    <p><strong id="win-stats"></strong></p>
    <button class="ghost" id="again">Nuova partita</button>
  </div>
</div>

<script>
// ===================== LOGIC =====================

// answers as the player reads and hears them
const ANSWER_TEXT = {yes: "Sì", no: "No", partly: "Sì, ma non solo", irrelevant: "Non importa",
                     invalid: "Domanda non valida: chiedi con un si o no", unclear: "Non ho capito, puoi ripetere?",
                     open: "Chiedi con un sì o un no"};
const LABELS = {deduction: "DEDUZIONE", theory: "TEORIA"};   // label on top of the wide cards
const $ = (id) => document.getElementById(id);
let gameId = null;
let busy = false;        // true while waiting for the judge: no new questions meanwhile
let pastOpen = false;    // to animate the past only when it opens
let links = [];          // [empty note, linked card ids, theory] for the red threads

// ---------- game ----------
async function newGame() {
  const data = await (await fetch("/api/games", {method: "POST"})).json();
  gameId = data.id;
  pastOpen = false;
  $("case").textContent = `Caso N°1 · ${data.title}`;
  $("story-text").textContent = data.story;
  renderBoard(data.board, []);
  $("log").replaceChildren();
  $("log-count").textContent = 0;
  $("questions").textContent = 0;
  $("score").textContent = 0;
  $("question").textContent = "";
  $("answer").textContent = "";
  $("win").classList.remove("open");
}

async function ask(text) {
  text = text.trim();
  if (!text || busy || !gameId) return;
  setBusy(true);
  $("question").textContent = `«${text}»`;   // shown at once, replaced by the judge's version
  $("answer").textContent = "…";
  $("answer").className = "answer";
  try {
    const response = await fetch(`/api/games/${gameId}/ask`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text}),
    });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    showTurn(await response.json());
  } catch (error) {
    $("answer").textContent = "Errore, riprova";
    console.error(error);
  } finally {
    setBusy(false);
  }
}

function showTurn(data) {
  // subtitle: the question as the judge understood it, then the answer
  $("question").textContent = `«${data.positive_question}»`;
  $("answer").textContent = ANSWER_TEXT[data.answer];
  $("answer").className = `answer ${data.answer}`;
  renderBoard(data.board, data.new_cards);
  if (!["unclear", "open"].includes(data.answer)) addToLog(data);   // not understood or not yes/no: does not count
  $("questions").textContent = data.questions;
  $("score").textContent = data.score;
  speakTurn(data);
  if (data.won) showWin(data);
}

// ---------- board ----------
function renderBoard(board, newCards) {
  const newIds = new Set(newCards.map((card) => card.id));
  const restaurant = [], past = [];
  const inZone = (zone) => (zone === "past" ? past : restaurant);

  // cards found, then the threads waiting for a "?", then the guide questions
  board.cards.forEach((card) => inZone(card.zone).push(cardElement(card, newIds.has(card.id))));
  links = [];
  let finalNote = null;
  board.threads.forEach((thread, i) => {
    const note = thread.final
      ? emptyNote("final", "IL CASO", thread.question, "final")
      : emptyNote(`thread${thread.theory ? " theory" : ""}`, thread.theory ? "TEORIA" : null, thread.question, `t${i}`);
    links.push([note, thread.cards, thread.theory]);
    if (thread.final) finalNote = note;
    else inZone(thread.zone).push(note);
  });
  board.guides.forEach((guide) => inZone(guide.zone).push(emptyNote("guide", "INDAGA", guide.question, guide.question)));
  placeWidePins(restaurant);
  placeWidePins(past);

  $("zone-restaurant").replaceChildren(...restaurant);
  $("out-restaurant").replaceChildren(...ruledOutRow(board, "restaurant", newIds));
  $("final-wrap").replaceChildren(...(finalNote ? [finalNote] : []));

  // the past: a sealed file until its first card, then a zone like the restaurant
  if (board.past_open) {
    const grid = element("div", "cards");
    grid.replaceChildren(...past);
    const title = element("h2", "zone-title", "ANNI PRIMA");
    $("zone-past").replaceChildren(title, grid, ...ruledOutRow(board, "past", newIds));
    if (!pastOpen) $("zone-past").classList.add("opened");   // animate only the first time
  } else {
    const file = element("div", "sealed");
    file.append(element("span", "stamp", "SIGILLATO"), element("p", null, "Qualcosa è successo prima del ristorante…"));
    $("zone-past").replaceChildren(file);
    $("zone-past").classList.remove("opened");
  }
  pastOpen = board.past_open;
  requestAnimationFrame(drawThreads);   // threads need the notes already laid out
}

function ruledOutRow(board, zone, newIds) {
  // the ruled-out leads of a zone, in a row of their own at its bottom
  const leads = board.ruled_out.filter((card) => card.zone === zone).map((card) => cardElement(card, newIds.has(card.id)));
  if (!leads.length) return [];
  const grid = element("div", "cards");
  grid.replaceChildren(...leads);
  return [element("h3", "out-title", "PISTE SCARTATE"), grid];
}

function cardElement(card, isNew) {
  const el = element("article", `card ${card.kind}${isNew ? " new" : ""}`);
  el.dataset.id = card.id;
  el.style.setProperty("--tilt", `${tilt(card.id)}deg`);
  if (LABELS[card.kind]) el.append(element("span", "label", LABELS[card.kind]));
  el.append(card.kind === "ruled_out" ? element("span", "struck", card.text) : card.text);
  return el;
}

function emptyNote(kind, label, question, key) {
  // an empty note with a red "?": a guide question, a thread to explain, or the final question
  const el = element("div", `slot ${kind}`);
  el.style.setProperty("--tilt", `${tilt(key) / 2}deg`);
  if (label) el.append(element("span", "label", label));
  el.append(element("span", "mark", "?"));
  if (question) el.append(element("span", "q", question));
  return el;
}

function placeWidePins(elements) {
  // wide cards take the whole row: alternate their pins so their threads do not overlap
  elements.filter((el) => el.matches(".card.deduction, .card.theory"))
          .forEach((el, i) => el.style.setProperty("--pin", i % 2 ? "70%" : "30%"));
}

function element(tag, className, text) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (text) el.textContent = text;
  return el;
}

function tilt(key) {
  // a small tilt fixed for each note, so the notes look pinned by hand
  let sum = 0;
  for (const ch of key) sum += ch.charCodeAt(0);
  return (sum % 5) - 2;
}

// ---------- red threads: from each linked card to its "?" ----------
function anchor(el, origin, bottom) {
  // the pin on top of a note, or the middle of its bottom edge when the thread leaves downward
  const box = el.getBoundingClientRect();
  const pinX = parseFloat(el.style.getPropertyValue("--pin")) || 50;
  return {x: box.left + box.width * pinX / 100 - origin.left, y: (bottom ? box.bottom : box.top) - origin.top};
}

function drawThreads() {
  const svg = $("threads");
  const origin = $("board").getBoundingClientRect();
  svg.replaceChildren();
  for (const [note, ids, theory] of links) {
    const noteBox = note.getBoundingClientRect();
    for (const id of ids) {
      const card = document.querySelector(`.card[data-id="${id}"]`);
      if (!card) continue;
      const cardBox = card.getBoundingClientRect();
      let from, to, bow = 0;
      if (cardBox.top >= noteBox.bottom) {          // card below the "?": up to the bottom of the "?"
        from = anchor(card, origin, false);
        to = anchor(note, origin, true);
      } else if (cardBox.bottom <= noteBox.top) {   // card above: down to the pin of the "?"
        from = anchor(card, origin, true);
        to = anchor(note, origin, false);
      } else {                                      // same row: pin to pin, arching over the notes
        from = anchor(card, origin, false);
        to = anchor(note, origin, false);
        bow = -Math.min(26, 10 + Math.abs(to.x - from.x) / 12);
      }
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", `M${from.x},${from.y} Q${(from.x + to.x) / 2},${(from.y + to.y) / 2 + bow} ${to.x},${to.y}`);
      if (theory) path.setAttribute("class", "theory");
      svg.append(path);
    }
  }
}

function addToLog(data) {
  $("log").prepend(element("li", null, `${data.positive_question} — ${ANSWER_TEXT[data.answer]}`));   // newest first
  $("log-count").textContent = data.questions;
}

function showWin(data) {
  $("solution").textContent = data.solution;
  $("win-stats").textContent = `Risolto in ${data.questions} domande · ${data.score} punti`;
  $("win").classList.add("open");
}

function setBusy(value) {
  busy = value;
  $("mic").disabled = value;
  $("typed-input").disabled = value;
}

// ---------- voice out: the browser reads the answers ----------
function speak(text) {
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "it-IT";
  speechSynthesis.speak(utterance);
}

function speakTurn(data) {
  speak(ANSWER_TEXT[data.answer]);
  const found = data.new_cards.filter((card) => card.kind !== "ruled_out");
  if (data.won) speak("Caso risolto!");
  else if (found.length) speak(`${found[0].kind === "theory" ? "Nuova teoria" : "Nuovo indizio"}: ${found[0].text}`);   // the first card is the one earned
}

// ---------- voice in: press, speak, stop ----------
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null;
let heard = "";           // words transcribed so far for the current question
let sent = false;         // true once the current question has been sent
let silenceTimer = null;

// send what was heard (only once) and stop listening
function finish() {
  clearTimeout(silenceTimer);
  recognizer.stop();
  if (heard && !sent) {
    sent = true;
    ask(heard);
  }
}

if (Recognition) {
  recognizer = new Recognition();
  recognizer.lang = "it-IT";
  recognizer.interimResults = true;   // show the words while the player speaks
  recognizer.onstart = () => { heard = ""; sent = false; };
  recognizer.onresult = (event) => {
    const result = event.results[event.results.length - 1];
    heard = result[0].transcript;
    $("transcript").textContent = heard;
    clearTimeout(silenceTimer);
    silenceTimer = setTimeout(finish, 2000);   // transcript unchanged for 2 s (e.g. TV noise): send it
    if (result.isFinal) finish();               // the browser detected the pause by itself
  };
  recognizer.onend = () => {
    $("mic").classList.remove("listening");
    finish();   // some browsers (iPhone) end without a final result
  };
} else {
  // no speech recognition in this browser (e.g. Firefox): typing only
  $("mic").hidden = true;
  $("mic-hint").textContent = "Il riconoscimento vocale non è disponibile in questo browser";
  $("typed").classList.add("open");
}

function listen() {
  if (!recognizer || busy) return;
  if ($("mic").classList.contains("listening")) { finish(); return; }   // second press: send now
  speechSynthesis.cancel();   // stop reading, so the microphone does not hear the page
  $("transcript").textContent = "";
  $("mic").classList.add("listening");
  recognizer.start();
}

// ---------- controls ----------
$("mic").addEventListener("click", listen);
document.addEventListener("keydown", (event) => {
  // the space bar works like the microphone button, except while typing
  if (event.code === "Space" && document.activeElement.tagName !== "INPUT") {
    event.preventDefault();
    listen();
  }
});
$("typed").addEventListener("submit", (event) => {
  event.preventDefault();
  ask($("typed-input").value);
  $("typed-input").value = "";
});
$("toggle-typed").addEventListener("click", (event) => {
  event.preventDefault();
  $("typed").classList.toggle("open");
  $("typed-input").focus();
});
$("read-story").addEventListener("click", () => {
  speechSynthesis.cancel();
  speak($("story-text").textContent);
});
$("again").addEventListener("click", newGame);
window.addEventListener("resize", drawThreads);
document.fonts.ready.then(drawThreads);   // the typewriter font changes the card sizes once loaded
$("board").addEventListener("animationend", drawThreads);   // redraw once new cards have settled

newGame();
</script>
</body>
</html>
